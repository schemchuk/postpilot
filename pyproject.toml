[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postpilot"
version = "0.1.0"
description = "A Telegram-approved content publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=43", "httpx>=0.27", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pre-commit"]

[project.scripts]
postpilot = "postpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"postpilot.store" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL database"]
